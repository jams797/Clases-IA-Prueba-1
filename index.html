<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142bca">
  <meta name="description" content="Acceso de demostración a la banca en línea de Jose S.A.">
  <title>Iniciar sesión | Jose S.A.</title>
  <link rel="stylesheet" href="styles.css">
  <script src="auth.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="background-art" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <main class="page">
    <section class="card" aria-labelledby="welcome-title">
      <div class="brand"><img src="assets/jose-sa-logo.svg" alt="Jose S.A." width="1190" height="340"></div>
      <header class="intro">
        <h1 id="welcome-title">Bienvenido</h1>
        <p>Ingresa a tu banca en línea para realizar<br class="desktop-break"> transferencias y pagos.</p>
      </header>
      <noscript><p class="form-error">Activa JavaScript en tu navegador para validar los datos e iniciar sesión.</p></noscript>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Usuario</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg>
            <input id="email" name="email" type="email" autocomplete="username" placeholder="nombre@correo.com" required aria-describedby="email-error" autocapitalize="none" spellcheck="false">
          </div>
          <p id="email-error" class="field-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required aria-describedby="password-error">
            <button id="toggle-password" class="icon-button" type="button" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m4 3 16 18"/></svg>
            </button>
          </div>
          <p id="password-error" class="field-error" aria-live="polite"></p>
        </div>

        <div class="form-options">
          <label class="checkbox"><input id="remember" type="checkbox" name="remember"><span>Recordar usuario</span></label>
          <button class="text-button" type="button" data-dialog="recovery">¿Olvidaste tu contraseña?</button>
        </div>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button id="submit-login" class="button primary" type="submit">Iniciar sesión</button>
        <div class="divider" aria-hidden="true"><span>o</span></div>
        <button class="button secondary" type="button" data-dialog="biometric">
          <svg class="icon fingerprint" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9a8 8 0 0 1 16 0M2 13v-2M22 11v3M7 20c2-3 1-6 1-9a4 4 0 0 1 8 0c0 5 0 8-2 11M4 17c1-2 0-4 1-7M11 18c1-3 0-5 1-7M18 19c1-3 1-5 1-8M10 22l1-2"/></svg>
          Ingresar con biometría
        </button>
      </form>
      <aside class="demo-note"><span class="demo-badge">DEMO</span> Prueba con <strong>demo@jose.com</strong> y <strong>Jose2026!</strong></aside>
    </section>
    <footer class="page-footer">
      <p>¿Aún no tienes cuenta? <a class="footer-link" href="registro.html">Regístrate</a></p>
      <p class="security-note"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 8 3v6c0 5-8 11-8 11S4 16 4 11V5l8-3Z"/><path d="m8 11 3 3 5-5"/></svg> Tu contraseña no se guarda en este equipo</p>
    </footer>
  </main>

  <dialog id="info-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
    <div class="dialog-heading"><span class="demo-badge">JOSE S.A.</span><button id="close-dialog" class="close-button" type="button" aria-label="Cerrar">×</button></div>
    <h2 id="dialog-title"></h2>
    <p id="dialog-description"></p>
    <button id="dialog-accept" class="button primary" type="button">Entendido</button>
  </dialog>
</body>
</html>
